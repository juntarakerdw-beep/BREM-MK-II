<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Event Management</title>
      <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BREM MK II">
    <link rel="apple-touch-icon" href="/brem-mk2-icon-light.png">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(() => console.log("BREM Service Worker registered"))
            .catch(err => console.error("BREM Service Worker registration failed:", err));
        });
      }
    </script>
</body>
</html>
